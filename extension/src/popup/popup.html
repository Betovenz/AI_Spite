<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>BlueSPite</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>BlueSPite</h1>
    <span class="ver" id="ver"></span>
  </header>
  <p class="line" id="bridge">กำลังหา bridge…</p>
  <ul class="sites">
    <li><span id="shopeeDot" class="dot small"></span> Shopee <em id="shopeeInfo"></em></li>
    <li><span id="flowDot" class="dot small"></span> Google Flow <em id="flowInfo"></em></li>
  </ul>
  <div class="actions">
    <button id="reconnect">เชื่อมต่อใหม่</button>
    <button id="open">เปิดหน้าเว็บ</button>
  </div>
  <p class="hint">เว็บ BlueSPite ต้องรันอยู่ (npm start) ก่อน extension จะเชื่อมต่อได้</p>
  <script src="popup.js"></script>
</body>
</html>
